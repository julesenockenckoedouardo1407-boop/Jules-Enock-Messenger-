<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#168a4a"><link rel="manifest" href="manifest.json"><title>Jules Enock Messenger</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f5;color:#18231d}header{background:#168a4a;color:#fff;padding:16px;font-size:20px;font-weight:bold}main{max-width:650px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #0001}input,button{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #ccd5cf;font-size:16px}button{background:#168a4a;color:#fff;border:0;font-weight:bold}.secondary{background:#e9f1ec;color:#17633b}.danger{background:#b3261e}.hidden{display:none}.muted{color:#68756d;font-size:14px}.tabs{display:flex;gap:8px}.tabs button{flex:1}.user{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.chat{height:55vh;overflow:auto;background:#eef4f0;border-radius:12px;padding:10px}.msg{max-width:78%;padding:9px 12px;border-radius:14px;margin:7px 0;background:#fff}.mine{margin-left:auto;background:#d6f2df}.row{display:flex;gap:8px}.row input{flex:1}.row button{width:auto;padding:0 18px}</style></head><body><header>Jules Enock Messenger</header><main>
<section id="auth"><div class="card"><h2>Créer un compte</h2><input id="regFirst" placeholder="Prénom"><input id="regLast" placeholder="Nom"><input id="regEmail" type="email" placeholder="Email"><input id="regPass" type="password" placeholder="Mot de passe (6 caractères minimum)"><button id="registerBtn">S'inscrire</button></div><div class="card"><h2>Se connecter</h2><input id="loginEmail" type="email" placeholder="Email"><input id="loginPass" type="password" placeholder="Mot de passe"><button id="loginBtn">Connexion</button><p id="authMsg" class="muted"></p></div></section>
<section id="app" class="hidden"><div class="tabs"><button id="searchTab">Rechercher</button><button id="profileTab" class="secondary">Profil</button><button id="logoutBtn" class="danger">Déconnexion</button></div><div id="searchPanel" class="card"><h2>Nouvelle conversation</h2><input id="searchEmail" type="email" placeholder="Email exact de l'utilisateur"><button id="searchBtn">Rechercher</button><div id="users"></div></div><div id="profilePanel" class="card hidden"><h2>Mon profil</h2><p id="profileText"></p></div><div id="chatPanel" class="card hidden"><button id="backBtn" class="secondary">← Retour</button><h2 id="chatTitle">Conversation</h2><div id="chat" class="chat"></div><div class="row"><input id="messageInput" placeholder="Écrire un message..."><button id="sendBtn">Envoyer</button></div></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,query,where,getDocs,addDoc,onSnapshot,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDEGccc-8c4gUTdv7iz4kZSU8kqpT0KqDs",authDomain:"jules-enock-messenger.firebaseapp.com",projectId:"jules-enock-messenger",storageBucket:"jules-enock-messenger.firebasestorage.app",messagingSenderId:"290311206198",appId:"1:290311206198:web:48983af157801ad734ef97",measurementId:"G-B88PM4ETMY"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const $=id=>document.getElementById(id);let currentUser=null,unsub=null,conversation=null;
function show(id,x){$(id).classList.toggle("hidden",!x)}
$("registerBtn").onclick=async()=>{try{let f=$("regFirst").value.trim(),l=$("regLast").value.trim(),e=$("regEmail").value.trim().toLowerCase(),p=$("regPass").value;if(!f||!l||!e||p.length<6){$("authMsg").textContent="Remplis tous les champs. Mot de passe: 6 caractères minimum.";return}let c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(doc(db,"users",c.user.uid),{firstName:f,lastName:l,email:e,createdAt:serverTimestamp()});}catch(e){$("authMsg").textContent=e.message}};
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("loginEmail").value.trim().toLowerCase(),$("loginPass").value);$("authMsg").textContent=""}catch(e){$("authMsg").textContent=e.message}};
$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{currentUser=u;show("auth",!u);show("app",!!u);if(u){let s=await getDoc(doc(db,"users",u.uid)),d=s.exists()?s.data():{};$("profileText").innerHTML="<b>"+(d.firstName||"")+" "+(d.lastName||"")+"</b><br>"+u.email}});
$("searchTab").onclick=()=>{show("searchPanel",1);show("profilePanel",0);show("chatPanel",0)};
$("profileTab").onclick=()=>{show("searchPanel",0);show("profilePanel",1);show("chatPanel",0)};
$("searchBtn").onclick=async()=>{let e=$("searchEmail").value.trim().toLowerCase();$("users").innerHTML="";if(!e)return;let s=await getDocs(query(collection(db,"users"),where("email","==",e)));if(s.empty){$("users").innerHTML='<p class="muted">Aucun utilisateur trouvé.</p>';return}s.forEach(d=>{if(d.id===currentUser.uid)return;let x=d.data(),el=document.createElement("div");el.className="user";el.textContent=(x.firstName||"")+" "+(x.lastName||"")+" — "+x.email;el.onclick=()=>openChat(d.id,x);$("users").appendChild(el)})};
async function openChat(uid,other){let ids=[currentUser.uid,uid].sort();conversation=ids.join("_");let cr=doc(db,"conversations",conversation),c=await getDoc(cr);if(!c.exists())await setDoc(cr,{members:ids,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:""});$("chatTitle").textContent=(other.firstName||"")+" "+(other.lastName||"");show("searchPanel",0);show("profilePanel",0);show("chatPanel",1);if(unsub)unsub();unsub=onSnapshot(query(collection(db,"conversations",conversation,"messages"),orderBy("createdAt","asc")),s=>{$("chat").innerHTML="";s.forEach(d=>{let m=d.data(),el=document.createElement("div");el.className="msg"+(m.senderId===currentUser.uid?" mine":"");el.textContent=m.text||"";$("chat").appendChild(el)});$("chat").scrollTop=$("chat").scrollHeight})}
$("backBtn").onclick=()=>{if(unsub)unsub();show("chatPanel",0);show("searchPanel",1)};
$("sendBtn").onclick=send;$("messageInput").onkeydown=e=>{if(e.key==="Enter")send()};
async function send(){let t=$("messageInput").value.trim();if(!t||!conversation)return;$("messageInput").value="";await addDoc(collection(db,"conversations",conversation,"messages"),{senderId:currentUser.uid,text:t,createdAt:serverTimestamp()});await setDoc(doc(db,"conversations",conversation),{lastMessage:t,updatedAt:serverTimestamp()},{merge:true})}
</script></body></html>
