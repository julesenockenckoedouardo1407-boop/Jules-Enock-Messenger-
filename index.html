  
    <!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#168a4a">
<link rel="manifest" href="manifest.json">

<title>Jules Enock Messenger</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#18231d
}

header{
  background:#168a4a;
  color:white;
  padding:16px;
  font-size:20px;
  font-weight:bold;
  text-align:center
}

main{
  max-width:650px;
  margin:auto;
  padding:14px
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 3px 14px #0001
}

input,button{
  width:100%;
  padding:13px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ccd5cf;
  font-size:16px
}

button{
  background:#168a4a;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer
}

.secondary{
  background:#e9f1ec;
  color:#17633b
}

.danger{
  background:#b3261e
}

.hidden{
  display:none!important
}

.muted{
  color:#68756d;
  font-size:14px
}

.tabs{
  display:flex;
  gap:7px
}

.tabs button{
  flex:1
}

.user{
  padding:14px;
  border-bottom:1px solid #eee;
  cursor:pointer
}

.user:hover{
  background:#f1f7f3
}

.chat{
  height:52vh;
  overflow:auto;
  background:#eef4f0;
  border-radius:12px;
  padding:10px
}

.msg{
  max-width:80%;
  padding:10px 13px;
  border-radius:15px;
  margin:7px 0;
  background:white;
  word-wrap:break-word
}

.mine{
  margin-left:auto;
  background:#d6f2df
}

.row{
  display:flex;
  gap:7px
}

.row input{
  flex:1
}

.row button{
  width:auto;
  padding:0 18px
}

.chathead{
  display:flex;
  align-items:center;
  gap:8px
}

.chathead button{
  width:auto;
  margin:0;
  padding:9px 12px
}

.error{
  color:#b3261e;
  font-size:14px;
  margin-top:8px
}
</style>
</head>

<body>

<header>
Jules Enock Messenger
</header>

<main>

<!-- AUTHENTIFICATION -->
<section id="auth">

<div class="card">
<h2>Créer un compte</h2>

<input id="regFirst" placeholder="Prénom">
<input id="regLast" placeholder="Nom">
<input id="regEmail" type="email" placeholder="Email">
<input id="regPass" type="password" placeholder="Mot de passe (6 caractères minimum)">

<button id="registerBtn">S'inscrire</button>

</div>

<div class="card">

<h2>Se connecter</h2>

<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPass" type="password" placeholder="Mot de passe">

<button id="loginBtn">Connexion</button>

<p id="authMsg" class="muted"></p>

</div>

</section>
